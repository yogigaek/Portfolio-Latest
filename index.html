    <!-- runs before CSS so the right look is painted first; the only place the hour map lives:
         05–14 day, 14–19 dusk, otherwise night. A saved manual choice wins. -->
    <script>
      (function () {
        var look = null
        try { look = localStorage.getItem('look') } catch (e) {}
        if (look !== 'morning' && look !== 'dusk' && look !== 'night') {
          var h = new Date().getHours()
          look = h >= 5 && h < 14 ? 'morning' : h >= 14 && h < 19 ? 'dusk' : 'night'
        }
        document.documentElement.setAttribute('data-look', look)
      })()
    </script>
